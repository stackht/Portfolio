<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The glass orb from the menu, on the site's cobalt. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6bff"/>
      <stop offset="1" stop-color="#1c3be0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe6ff"/>
      <stop offset="1" stop-color="#6f8bff"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="19" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.5"/>
  <ellipse cx="25.5" cy="24" rx="5.5" ry="3.2" fill="#ffffff" transform="rotate(-30 25.5 24)"/>
</svg>
